name: Pylint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # hash-pinned toolchain (incl. pip itself) for OSSF Pinned-Dependencies
        python -m pip install --require-hashes --no-deps -r .github/requirements/pylint.txt
    - name: Analysing the code with pylint
      run: |
        pylint --disable=C,R,E0401,W0107,W0613,W0612,W0221,W1203 $(git ls-files '*.py')
